name: Create signing key

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ganti keystore yang sudah ada (APK lama tidak bisa di-update)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check password and existing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${#KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "Secret KEYSTORE_PASSWORD is missing or shorter than 12 characters" >&2
            exit 1
          fi
          if [ -f android/signing/skytrace.keystore.enc ] && [ "$FORCE" != "true" ]; then
            echo "A keystore already exists. Run again with force enabled to replace it" >&2
            exit 1
          fi

      - name: Generate and encrypt keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/signing
          keytool -genkeypair \
            -keystore /tmp/skytrace.jks \
            -alias skytrace \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=SkyTrace, OU=Open Source, O=SkyTrace, C=ID"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in /tmp/skytrace.jks \
            -out android/signing/skytrace.keystore.enc \
            -pass env:KEYSTORE_PASSWORD
          {
            echo "### Sidik jari sertifikat"
            keytool -list -v -keystore /tmp/skytrace.jks -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/skytrace.jks

      - name: Commit encrypted keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/signing/skytrace.keystore.enc
          git commit -m "chore: add encrypted signing keystore"
          git push
