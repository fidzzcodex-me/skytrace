name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to pubspec
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Bootstrap Gradle wrapper
        run: bash scripts/bootstrap.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Setup signing
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash scripts/setup_signing.sh
          if [ "${{ steps.signing.outputs.signing }}" = "none" ]; then
            echo "No signing key found. Create the KEYSTORE_PASSWORD secret and run the Create signing key workflow first" >&2
            exit 1
          fi

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Build signed AAB
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Name artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/SkyTrace-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/SkyTrace-${{ steps.version.outputs.tag }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Generate changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || true)"
          {
            echo "## SkyTrace ${{ steps.version.outputs.tag }}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV"
              echo
              git log "$PREV..${{ steps.version.outputs.tag }}" --no-merges --pretty=format:"- %s (%h)"
            else
              echo "Initial release"
              echo
              git log --no-merges --pretty=format:"- %s (%h)"
            fi
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SkyTrace ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/SkyTrace-${{ steps.version.outputs.tag }}.apk
            dist/SkyTrace-${{ steps.version.outputs.tag }}.aab
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Remove signing key
        if: always()
        run: |
          rm -f android/app/release.jks android/key.properties

  bump-version:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version in pubspec
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml

      - name: Commit version bump
        run: |
          if git diff --quiet; then
            echo "version already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${GITHUB_REF_NAME}"
          git push origin main
